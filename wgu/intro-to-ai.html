  }

    border:1px solid var(--border);

    border:1px solid var(--border);

    border-radius:3px;

  .q-opt.wrong{border-color:var(--rust);background:rgba(184,105,74,.15);}

    margin-top:8px;
    font-size:.82rem;
    color:var(--text-dim);
    display:none;
  }
</style>

<script>
const CATS = {
  foundations: {label:'Foundations', color:'#c9a24b'},
  agents:      {label:'Agents & Environments', color:'#6c8fae'},
  ethics:      {label:'Ethics & Privacy', color:'#b8694a'},
  prob:        {label:'Probability & Bayesian', color:'#9b7bab'},
  nlp:         {label:'NLP', color:'#7f9e83'},
  vision:      {label:'Computer Vision', color:'#c98a4b'},
  ml:          {label:'Machine Learning & RL', color:'#4b9ec9'},
  data:        {label:'Data Types & Quality', color:'#a67c9c'},
  clean:       {label:'Data Cleaning & Stats', color:'#8aa65a'}
};

const TERMS = [
// FOUNDATIONS
{t:"Artificial Intelligence (AI)", d:"Machine-driven, human-like intelligence and problem-solving systems.", c:"foundations"},
{t:"Intelligence", d:"The ability to understand, apply knowledge, and solve complex problems.", c:"foundations"},
{t:"Rationality", d:"The ability to make sound decisions.", c:"foundations"},
{t:"Turing Test", d:"A thought experiment that decides a computer's ability to respond as a human.", c:"foundations"},
{t:"Total Turing Test", d:"Evaluates a machine's intelligence by assessing its ability to not only communicate in natural language but also perceive and interact with the physical world and become indistinguishable from a human.", c:"foundations"},
{t:"Knowledge Representation", d:"The ability to store information.", c:"foundations"},
{t:"Automated Reasoning", d:"The computer's ability to answer questions and draw new conclusions.", c:"foundations"},
{t:"Machine Learning (ML)", d:"The field of study that gives computers the ability to learn from data without being explicitly programmed; more broadly, a type of AI where computers learn from data and improve performance over time.", c:"foundations"},
{t:"Robotics", d:"The ability to manipulate and move objects; the branch of technology dealing with the design, construction, operation, and application of robots.", c:"foundations"},
{t:"Dualism", d:"Posits the existence of two distinct and independent realities.", c:"foundations"},
{t:"Empiricism", d:"Emphasizes knowledge acquisition through sensory experiences and observations.", c:"foundations"},
{t:"Induction", d:"Involves drawing general conclusions from specific observations; figuring out general rules from specific examples.", c:"foundations"},
{t:"Deduction", d:"Drawing specific conclusions from general rules or facts.", c:"foundations"},
{t:"AI Observation Sentence", d:"A statement generated by an AI system based on its analysis of data, reflecting the AI's interpretation of observed patterns or trends.", c:"foundations"},
{t:"Legal Positivism", d:"A theory of laws where rules are created by humans and valid based on legitimate authority.", c:"foundations"},
{t:"Neural Networks", d:"Computational models inspired by the human brain, consisting of interconnected layers of nodes that process and learn from data to recognize patterns and make predictions.", c:"foundations"},
{t:"Ethical Artificial Intelligence", d:"Considers that the study and use of AI technologies should follow ethical rules to ensure fairness, transparency, and accountability.", c:"foundations"},
{t:"Algorithm", d:"A step-by-step procedure or formula for solving a problem, often used in programming and data processing.", c:"foundations"},

// AGENTS & ENVIRONMENTS
{t:"Agent", d:"Anything that can be viewed as perceiving its environment through sensors.", c:"agents"},
{t:"Environment", d:"The part that affects what an agent perceives.", c:"agents"},
{t:"Actuators", d:"A device that causes motion (robotic movement).", c:"agents"},
{t:"Percept", d:"The content of an agent's sensors.", c:"agents"},
{t:"Percept Sequence", d:"The history of everything an agent has perceived.", c:"agents"},
{t:"Agent Function", d:"Maps percept sequence to actions.", c:"agents"},
{t:"Task Environment", d:"Specific setting or context in which an AI agent operates and performs its designated tasks.", c:"agents"},
{t:"PEAS", d:"Performance, Environment, Actuators, Sensors.", c:"agents"},
{t:"Software Agent", d:"A computer program that acts for another user or program in a relationship with an agent.", c:"agents"},
{t:"Softbot", d:"A program that issues commands within a software environment and interprets feedback.", c:"agents"},
{t:"Fully Observable", d:"Occurs when sensors detect all aspects that are relevant to the choice of an action.", c:"agents"},
{t:"Partially Observable", d:"Occurs when parts of a state are missing from sensor data.", c:"agents"},
{t:"Unobservable", d:"When an agent has no sensors.", c:"agents"},
{t:"Single Agent", d:"One agent performing a task.", c:"agents"},
{t:"Multiagent", d:"When two or more agents perform a task together.", c:"agents"},
{t:"Competitive", d:"Maximizes agent performance measures by avoiding the pitfalls of predictability.", c:"agents"},
{t:"Cooperative", d:"Allows single-space occupancy.", c:"agents"},
{t:"Deterministic", d:"When the state of an environment is completely decided by the current state and action executed by an agent.", c:"agents"},
{t:"Nondeterministic", d:"When certain behaviors are unpredictable or unexpected.", c:"agents"},
{t:"Stochastic", d:"When the model of an environment explicitly deals with probabilities.", c:"agents"},
{t:"Episodic", d:"A process where agents do not think ahead but base decisions on current issues.", c:"agents"},
{t:"Sequential", d:"A concept where decisions affect future decisions.", c:"agents"},
{t:"Static Environment", d:"An environment that remains unchanged while an agent is deliberating or acting.", c:"agents"},
{t:"Dynamic Environment", d:"Environments that consistently question agents to make decisions and do nothing until agents make decisions.", c:"agents"},
{t:"Semi-Dynamic Environment", d:"An environment that does not change with time despite an agent's changing performance score.", c:"agents"},
{t:"Discrete", d:"A system that models problems that are too large to be continuous.", c:"agents"},
{t:"Continuous", d:"An environment where performed actions cannot be numbered.", c:"agents"},
{t:"Known", d:"An environment where the outcome of all actions is provided.", c:"agents"},
{t:"Unknown", d:"A situation where the AI agent has little or no prior knowledge about the environment it is operating in.", c:"agents"},
{t:"Environment Class", d:"A category or grouping in programming that encapsulates environmental variables and settings, allowing for the management and configuration of application behavior based on the specific context in which it operates.", c:"agents"},
{t:"Smart Agent", d:"A software program capable of performing tasks autonomously, learning from its environment, and making decisions or taking actions to achieve specific goals.", c:"agents"},
{t:"AI Agent", d:"A software entity that perceives its environment, processes information, and takes actions autonomously to achieve a specific objective.", c:"agents"},
{t:"Learning Agents", d:"The agents that handle making improvements.", c:"agents"},
{t:"Performance Element", d:"Selects external actions.", c:"agents"},
{t:"Critic", d:"Decides performance element modifications.", c:"agents"},
{t:"Problem Generator", d:"Suggests actions that lead to new and informative experiences.", c:"agents"},
{t:"Reward", d:"Provides direct feedback on the quality of agent behavior.", c:"agents"},
{t:"Penalty", d:"Provides critical feedback on agent behavior.", c:"agents"},
{t:"Training Data", d:"A set of examples used to teach a machine learning model, allowing it to learn patterns and make predictions or decisions.", c:"agents"},
{t:"Operational Data", d:"Information generated during the regular functioning of a system, used for monitoring, managing, and improving ongoing operations.", c:"agents"},
{t:"Human-Level AI", d:"Commonly referred to as artificial general intelligence (AGI); AI's ability to understand, learn, and perform humanlike tasks.", c:"agents"},
{t:"Artificial Superintelligence (ASI)", d:"Refers to the future of AI, which could potentially surpass all levels of human intelligence.", c:"agents"},
{t:"Gorilla Problem", d:"Refers to apprehension about creating superintelligent machines.", c:"agents"},
{t:"King Midas Problem", d:"Describes a hypothetical scenario or challenge that arises when designing intelligent systems that optimize for a specific objective without considering the broader consequences or trade-offs.", c:"agents"},
{t:"Assistance Game", d:"Occurs when a machine tries to achieve a human objective.", c:"agents"},
{t:"Inverse Reinforcement Learning", d:"Occurs when machines learn about human preferences by observing human choices.", c:"agents"},

// ETHICS & PRIVACY
{t:"AI Ethics", d:"The examination of moral issues related to the development and use of artificial intelligence, including fairness, transparency, and societal impact.", c:"ethics"},
{t:"Negative Side Effects", d:"The harmful effects that technologies have on the world.", c:"ethics"},
{t:"Surveillance Cameras", d:"Recording devices that capture movement.", c:"ethics"},
{t:"Cybersecurity", d:"The practice of protecting computer systems, networks, and digital data from unauthorized access, attacks, damage, or theft.", c:"ethics"},
{t:"De-identification", d:"The process of removing identifying information.", c:"ethics"},
{t:"Generalizing Fields", d:"A form of minimizing risks by minimizing information.", c:"ethics"},
{t:"K-Anonymity", d:"Indistinguishable database.", c:"ethics"},
{t:"Aggregate Querying", d:"Processes the data from multiple indexed entities to return a single summary value.", c:"ethics"},
{t:"Differential Privacy", d:"A mathematical framework that ensures the privacy of individuals in a dataset by guaranteeing that including or excluding any single individual's data does not significantly affect analysis outcomes.", c:"ethics"},
{t:"Federated Learning", d:"Also called collaborative learning; a decentralized approach to training machine learning models that does not require exchanging data from client devices, ensuring privacy.", c:"ethics"},
{t:"Secure Aggregation", d:"A privacy-preserving technique that allows multiple parties to collaboratively compute an aggregate value (e.g., a sum or average) without revealing their raw data to each other.", c:"ethics"},
{t:"Sybil", d:"A single entity that creates multiple identities to gain an unfair advantage or manipulate a system, often seen in online platforms and networks.", c:"ethics"},
{t:"Sybil Attack", d:"Occurs when an attacker creates multiple fake identities or nodes to disrupt or gain control over a network, influencing decisions or overwhelming resources.", c:"ethics"},
{t:"Existence Uncertainty", d:"Refers to the lack of certainty about whether a particular entity or event exists within a given context or model.", c:"ethics"},
{t:"Identity Uncertainty", d:"Involves not knowing the identity of an individual or entity, often due to incomplete or ambiguous information.", c:"ethics"},
{t:"Open-Universe Probability Model (OUPM)", d:"A framework used to handle situations where the set of possible outcomes or entities is not fixed and can change over time as new information is introduced.", c:"ethics"},
{t:"Data Privacy", d:"Regulatory practices that protect personal data.", c:"ethics"},
{t:"Data Security", d:"Measures and practices designed to protect digital information from unauthorized access, corruption, or theft.", c:"ethics"},
{t:"Accountability and Governance", d:"Responsibility for actions and decisions; supported by a framework that ensures ethical conduct and adherence to regulations.", c:"ethics"},
{t:"Algorithmic Transparency", d:"The practice of making the processes and decision-making criteria of algorithms clear and understandable to users and stakeholders.", c:"ethics"},
{t:"Compliance Sources", d:"Guidelines, regulations, and standards that organizations refer to in order to ensure their practices meet legal and ethical requirements.", c:"ethics"},
{t:"Data Bias", d:"A systematic distortion in a dataset that leads to unfair or skewed outcomes in analysis or AI models.", c:"ethics"},
{t:"Bias in AI", d:"Systematic and unfair discrimination in the outcomes produced by AI systems, often due to biased training data.", c:"ethics"},
{t:"Autonomous Systems", d:"Systems that can perform tasks without human intervention, often using AI to make decisions.", c:"ethics"},

// PROBABILITY & BAYESIAN
{t:"Probabilistic Inference", d:"Deduction of probabilities from known data using probabilistic models.", c:"prob"},
{t:"Bayes' Rule", d:"Also known as Bayes' theorem; uses prior knowledge or beliefs (prior probabilities) with new data or observations to calculate revised probabilities (posterior probabilities).", c:"prob"},
{t:"Query", d:"A request for information or the probability of an event within a probabilistic model.", c:"prob"},
{t:"Marginal Probability", d:"The probability of a single event occurring, obtained by summing or integrating over other variables.", c:"prob"},
{t:"Marginalization", d:"The process of summing or integrating out unneeded variables to compute marginal probabilities.", c:"prob"},
{t:"Normalization", d:"Adjusting probabilities so that their total sums to one.", c:"prob"},
{t:"Marginal Independence", d:"When two variables are independent without conditioning on any other variables.", c:"prob"},
{t:"Conditional Independence", d:"When two variables are independent given the knowledge of a third variable.", c:"prob"},
{t:"Naive Bayes", d:"A classification algorithm based on Bayes' theorem with strong independence assumptions.", c:"prob"},
{t:"Naive Bayes Model", d:"Probability distribution model where the effect variables are not strictly independent of the given cause variable.", c:"prob"},
{t:"Bayesian Classifier", d:"A probabilistic model that classifies data based on Bayes' theorem, using prior knowledge and evidence to predict the likelihood of different outcomes.", c:"prob"},
{t:"Bayesian Inference", d:"A method of updating the probability of a hypothesis or event based on new evidence or information.", c:"prob"},
{t:"Number Statement", d:"A statement that provides specific quantitative information, such as a count or measurement, about a particular variable or phenomenon.", c:"prob"},
{t:"Poisson Distribution", d:"A probability distribution that describes the likelihood of a given number of events occurring within a fixed interval of time or space.", c:"prob"},
{t:"Discrete Log-Normal Distribution", d:"A probability distribution for a random variable whose logarithm is normally distributed, often used to model phenomena with multiplicative effects, where the variable takes on discrete values.", c:"prob"},
{t:"Order-of-Magnitude Distribution", d:"Describes the distribution of values based on their scale or size, often using logarithmic scales to analyze data that spans several orders of magnitude.", c:"prob"},
{t:"Number Variables", d:"Variables that represent quantitative values or counts, as opposed to categorical or qualitative data.", c:"prob"},
{t:"Random Variables", d:"Variables whose values are subject to randomness or uncertainty, typically used in probability and statistics to model and analyze random processes.", c:"prob"},

// NLP
{t:"Natural Language Processing (NLP)", d:"A field of AI that focuses on the interaction between computers and human languages, enabling machines to understand, interpret, and generate human language.", c:"nlp"},
{t:"Generative Program", d:"Software that autonomously creates new content or data, such as text, images, or designs, often using algorithms or AI.", c:"nlp"},
{t:"Grammar", d:"A collection of rules that specify how phrases can be organized in a structured way, often represented as a tree-like diagram.", c:"nlp"},
{t:"Semantic Rules", d:"Guidelines that govern how meanings are assigned to phrases and sentences in a language.", c:"nlp"},
{t:"Language Model", d:"Assigns the probability or likelihood of a string within a bag of words.", c:"nlp"},
{t:"Bag-of-Words (BoW) Model", d:"Represents text as an unordered collection of words, focusing on word frequency while ignoring word order.", c:"nlp"},
{t:"Corpus", d:"A collection of authentic text or audio organized into datasets.", c:"nlp"},
{t:"Tokenization", d:"The process of converting input text into smaller units or tokens, such as words or sub-words.", c:"nlp"},
{t:"Language", d:"The complete set of sentences that can be constructed by following the rules established by grammar.", c:"nlp"},
{t:"Syntactic Category", d:"A set of words and/or phrases in a language that share a significant number of common characteristics.", c:"nlp"},
{t:"Phrase Structure", d:"Rule to describe a language's syntax.", c:"nlp"},
{t:"Probabilistic Context-Free Grammar", d:"Assigns a probability to the rules.", c:"nlp"},
{t:"Word Embedding", d:"A dense vector that represents a word's meaning and relationships to other words.", c:"nlp"},
{t:"One-Hot Encoding", d:"A technique used in machine learning to represent categorical data as binary vectors, where each category becomes a unique vector with a single '1' marking its presence and '0's elsewhere.", c:"nlp"},
{t:"Recurrent Neural Network (RNN)", d:"A deep learning model that converts sequential data input into sequential data output over multiple time-steps.", c:"nlp"},
{t:"Feed Forward Neural Network (FFNN)", d:"A type of neural network where information moves only in one direction — from input to output — without loops; used for tasks like image classification where data is not sequential.", c:"nlp"},
{t:"Bidirectional RNN", d:"Concatenates a separate right-to-left model to the left-to-right model.", c:"nlp"},
{t:"Long Short-Term Memory (LSTM) Model", d:"An RNN designed to handle long-term dependencies in sequences using gating mechanisms to manage information flow.", c:"nlp"},
{t:"Sequence-to-Sequence Models", d:"Models that convert one sequence (like a sentence) into another sequence.", c:"nlp"},
{t:"Decoding", d:"The process of converting encoded data back into its original form.", c:"nlp"},
{t:"Greedy Decoding", d:"Choosing the most likely next word step-by-step, without considering future options.", c:"nlp"},
{t:"Beam Search", d:"A heuristic search algorithm that explores a graph by expanding the most promising node in a limited set.", c:"nlp"},
{t:"Machine Translation (MT)", d:"Translating text from one language to another.", c:"nlp"},
{t:"Transformer Architecture", d:"Used for translation between different languages using encoding and decoding.", c:"nlp"},
{t:"Self-Attention", d:"Understand dependencies and relationships within the input sequence.", c:"nlp"},
{t:"Multiheaded Attention", d:"Using multiple attention mechanisms at once to capture different details in the data.", c:"nlp"},
{t:"Transformer Encoding", d:"Creating a detailed representation of input data in transformer models.", c:"nlp"},
{t:"Transformer Decoding", d:"Generating output from an encoded input in transformer models.", c:"nlp"},
{t:"Pretraining", d:"Training a model on a large dataset before fine-tuning it on a specific, often smaller dataset.", c:"nlp"},
{t:"Transfer Learning", d:"Using a pre-trained model to help with a new but related task; reusing a model developed for one task as the starting point for a second task.", c:"nlp"},

// COMPUTER VISION
{t:"Computer Vision", d:"A field of AI that enables computers to interpret and understand visual information from the world, such as images and videos, to make decisions or perform tasks.", c:"vision"},
{t:"Stimulus", d:"An input or signal received by a system, often referring to sensory information used to trigger a response or reaction.", c:"vision"},
{t:"Passive Sensing", d:"A method of gathering information from the environment without emitting any signals, such as using a camera to capture images.", c:"vision"},
{t:"Active Sensing", d:"A method where the system emits signals (like light or sound) and measures the reflections to gather information about the environment.", c:"vision"},
{t:"Feature", d:"A number obtained by applying simple computations to an image, such as resolution, color, and pixel size.", c:"vision"},
{t:"Feature Extraction", d:"The process of identifying and isolating important features or attributes from raw data, such as edges or textures in images.", c:"vision"},
{t:"Mode-Based Approach", d:"A method that relies on predefined models or modes to analyze and interpret data.", c:"vision"},
{t:"Object Model", d:"A representation of an object that captures its key features and characteristics; used to recognize or analyze objects in images.", c:"vision"},
{t:"Rendering Model", d:"A framework or algorithm used to generate realistic images or visualizations of objects based on their 3D models and textures.", c:"vision"},
{t:"Reconstruction", d:"Builds a global model from an image.", c:"vision"},
{t:"Recognition", d:"Occurs when agents draw distinctions among objects.", c:"vision"},
{t:"Appearance", d:"The visual characteristics or features of an object as seen in an image or video.", c:"vision"},
{t:"Convolutional Neural Network (CNN)", d:"A type of neural network designed for processing grid-like data, such as images, by applying convolutional layers to extract features and patterns.", c:"vision"},
{t:"Dataset Augmentation", d:"Techniques used to artificially expand the size and diversity of a dataset by applying transformations like rotation, scaling, and flipping to the original data.", c:"vision"},

// ML & RL
{t:"Factored Representation", d:"Breaking down complex data into simpler parts for easier analysis.", c:"ml"},
{t:"Supervised Learning", d:"Training a model with labeled data, meaning the input data is paired with the correct output, to predict outcomes.", c:"ml"},
{t:"Unsupervised Learning", d:"Training a model with unlabeled data to find patterns or groupings without guidance.", c:"ml"},
{t:"Clustering", d:"Grouping similar items together based on their features.", c:"ml"},
{t:"Reinforcement Learning", d:"Learning by trying actions and getting rewards or penalties to improve decisions, maximizing cumulative reward.", c:"ml"},
{t:"Semi-Supervised Learning", d:"Using a small amount of labeled data with a lot of unlabeled data to help improve learning.", c:"ml"},
{t:"Weakly Supervised Learning", d:"Training models with labels that might be wrong or not very precise.", c:"ml"},

// ---- state ----
let activeCat = 'all';
let quizMode = false;
let unknownOnly = false;
let knownSet = new Set();
let query = '';

// build category pills
const catsEl = document.getElementById('cats');
function renderPills(){
  let html = `<div class="cat-pill ${activeCat==='all'?'active':''}" data-cat="all">All (${TERMS.length})</div>`;
  Object.keys(CATS).forEach(k=>{
    const count = TERMS.filter(x=>x.c===k).length;
    html += `<div class="cat-pill ${activeCat===k?'active':''}" data-cat="${k}" style="--pill-color:${CATS[k].color}">${CATS[k].label} (${count})</div>`;
  });
  catsEl.innerHTML = html;
  catsEl.querySelectorAll('.cat-pill').forEach(p=>{
    p.addEventListener('click', ()=>{ activeCat = p.dataset.cat; renderPills(); renderGrid(); });
  });
}

const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const countLine = document.getElementById('countLine');
const knownLine = document.getElementById('knownLine');

function renderGrid(){
  let list = TERMS;
  if(activeCat !== 'all') list = list.filter(x=>x.c===activeCat);
  if(query.trim()){
    const q = query.trim().toLowerCase();
    list = list.filter(x=> x.t.toLowerCase().includes(q) || x.d.toLowerCase().includes(q));
  }
  if(unknownOnly) list = list.filter(x=> !knownSet.has(x.t));

  grid.classList.toggle('quiz-hidden', quizMode);
  emptyEl.style.display = list.length ? 'none':'block';

  grid.innerHTML = list.map(x=>{
    const cat = CATS[x.c];
    const isKnown = knownSet.has(x.t);
    return `<div class="card ${isKnown?'known':''}" style="--cat-color:${cat.color}" data-term="${x.t.replace(/"/g,'&quot;')}">
      <div class="card-top">
        <div class="term">${x.t}</div>
        <div class="cat-tag">${cat.label}</div>
      </div>
      <div class="def">${x.d}</div>
      <div class="card-foot">
        <button class="known-btn ${isKnown?'on':''}" data-term-btn="${x.t.replace(/"/g,'&quot;')}">${isKnown?'✓ Mastered':'Mark mastered'}</button>
      </div>
    </div>`;
  }).join('');

  countLine.textContent = `${list.length} of ${TERMS.length} terms shown`;
  knownLine.textContent = `${knownSet.size} mastered`;

  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.known-btn')) return;
      const def = card.querySelector('.def');
      def.classList.toggle('show');
    });
  });
  grid.querySelectorAll('.known-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const term = btn.dataset.termBtn;
      if(knownSet.has(term)) knownSet.delete(term); else knownSet.add(term);
      renderGrid();
    });
  });
}

document.getElementById('search').addEventListener('input', e=>{
  query = e.target.value;
  renderGrid();
});
document.getElementById('quizToggle').addEventListener('click', e=>{
  quizMode = !quizMode;
  e.target.classList.toggle('active', quizMode);
  e.target.textContent = quizMode ? 'Show definitions' : 'Hide definitions';
  renderGrid();
});
document.getElementById('unknownToggle').addEventListener('click', e=>{
  unknownOnly = !unknownOnly;
  e.target.classList.toggle('active', unknownOnly);
  renderGrid();
});

renderPills();
renderGrid();

{q:"A dataset feature ranges from 0 to 1,000,000 while another ranges from 0 to 1. Before training a distance-based model, which technique would put both features on a comparable scale with mean 0 and standard deviation 1?", opts:["One-hot encoding", "Z-score standardization", "Binning", "Tokenization"], correct:1, explain:"Z-score standardization rescales any feature to have a mean of 0 and a standard deviation of 1, making differently scaled features comparable."},
{q:"A data science team first tests their pipeline on a 1,000-row sample before running it on the full 10-million-row dataset. What is the main benefit of this approach?", opts:["It guarantees the final model will be perfectly accurate.", "It lets the team iterate and catch problems faster before committing to the full run.", "It eliminates the need for data cleaning.", "It automatically converts unstructured data to structured data."], correct:1, explain:"Testing on a smaller subset first speeds up each iteration, letting teams catch problems before the costly full-scale run."},
{q:"Two datasets both describe the same event, but one contains obviously fabricated numbers alongside real ones. Which 'V' of big data does this problem primarily affect?", opts:["Volume", "Velocity", "Variety", "Veracity"], correct:3, explain:"Veracity concerns the trustworthiness and quality of the data; fabricated or unreliable values are a veracity problem, not one of volume, speed, or variety."},
{q:"A feature representing 'income' is heavily right-skewed, with most values clustered low and a few extremely high outliers. If left untransformed, what is the most likely consequence for a model trained on it?", opts:["The model will be unaffected since skew doesn't matter.", "Predictions may be biased toward the dense, low-income region.", "The model will automatically become more accurate.", "The feature will be dropped by the algorithm."], correct:1, explain:"Skewed, untransformed features can cause a model's predictions to be biased toward wherever most of the data is concentrated."},
{q:"After applying a log transformation to a skewed feature, the resulting histogram looks much more symmetric and bell-shaped. What does this suggest?", opts:["The transformation harmed the data's usefulness.", "The transformation likely improved the feature's suitability for modeling.", "The original data had no skew to begin with.", "The transformation increased the number of outliers."], correct:1, explain:"A more symmetric, bell-shaped distribution after transformation is generally a sign that the transformation helped the feature better fit model assumptions."},
{q:"If a Box-Cox transformation uses an exponent of 2 instead of 1/2, what operation does that exponent represent?", opts:["Taking the square root of each value", "Squaring each value", "Taking the reciprocal of each value", "Taking the natural log of each value"], correct:1, explain:"Raising each value to the power of 2 is squaring it, the same logic by which an exponent of 1/2 represents a square root."},
{q:"Which Python library would you reach for specifically to generate the histogram or scatterplot itself, once your data is already loaded into a DataFrame?", opts:["NumPy", "Matplotlib's pyplot module", "Pandas' read_csv function", "Scikit-learn's train_test_split"], correct:1, explain:"Pyplot, part of Matplotlib, is the module used to actually generate visualizations like histograms and scatterplots."},
{q:"An analyst converts an 'age' column into the categories '0-18', '19-35', '36-60', and '60+.' Which feature engineering technique is this?", opts:["One-hot encoding", "Binning", "Feature combination", "Feature dropping"], correct:1, explain:"Grouping a continuous numeric variable into discrete ranges or categories is the definition of binning."},
{q:"A dataset of delivery times has a few extremely long outlier deliveries. Which descriptive statistic would be least affected by those outliers when summarizing typical delivery time?", opts:["Mean", "Range", "Median", "Variance"], correct:2, explain:"The median, as the middle value, is far less sensitive to extreme outliers than the mean, range, or variance."}
];
function renderQuestions(){
  const el = document.getElementById('practice-list');
  if(!QUESTIONS.length){ return; }
  el.innerHTML = QUESTIONS.map((q,i)=>`
    <div class="q-card">
      <div class="q-text">${i+1}. ${q.q}</div>
      <div class="q-opts">
        ${q.opts.map((o,j)=>`<button class="q-opt" data-qi="${i}" data-oi="${j}">${o}</button>`).join('')}
      </div>
      <div class="q-explain" id="explain-${i}">${q.explain||''}</div>
    </div>`).join('');
  el.querySelectorAll('.q-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const qi = +btn.dataset.qi, oi = +btn.dataset.oi;
      const group = el.querySelectorAll(`.q-opt[data-qi="${qi}"]`);
      group.forEach(b=>b.disabled = true);
      group[QUESTIONS[qi].correct].classList.add('correct');
      if(oi !== QUESTIONS[qi].correct) btn.classList.add('wrong');
      document.getElementById(`explain-${qi}`).style.display = 'block';
    });
  });
}
renderQuestions();
</script>
</body>
</html>
